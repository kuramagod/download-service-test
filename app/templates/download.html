{% extends "base.html" %}
{% block title %}Загрузка данных{% endblock %}

{% block content %}
<div class="bg-white rounded-lg shadow p-6 max-w-2xl">
    <h1 class="text-xl font-semibold mb-4">Загрузка документов</h1>

    <div class="flex gap-3 mb-6">
        <button id="start-download-btn"
            class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white font-medium px-5 py-2 rounded-lg transition">
            Начать скачивание
        </button>
        <button id="stop-download-btn"
            class="bg-red-600 hover:bg-red-700 disabled:bg-gray-400 text-white font-medium px-5 py-2 rounded-lg transition">
            Остановить скачивание
        </button>
    </div>

    <div class="space-y-3">
        <div class="flex justify-between border-b pb-2">
            <span class="text-gray-500">Статус:</span>
            <span id="status-value" class="font-medium">—</span>
        </div>
        <div class="flex justify-between border-b pb-2">
            <span class="text-gray-500">Начало процесса (время НСК):</span>
            <span id="started-at-value" class="font-medium">—</span>
        </div>
        <div class="flex justify-between border-b pb-2">
            <span class="text-gray-500">Заблокировано до (время НСК):</span>
            <span id="blocked-until-value" class="font-medium">—</span>
        </div>
        <div class="flex justify-between border-b pb-2">
            <span class="text-gray-500">Сообщение сервиса:</span>
            <span id="message-value" class="font-medium">—</span>
        </div>

        <div>
            <div class="flex justify-between mb-1 text-sm text-gray-600">
                <span id="progress-label">Получено 0 имён файлов, скачано 0 из 0</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
                <div id="progress-bar" class="bg-blue-600 h-3 rounded-full transition-all" style="width:0%"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
