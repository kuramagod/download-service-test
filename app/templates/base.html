<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Сервис обработки файлов{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <header class="bg-white shadow">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center gap-6">
                <span class="text-lg font-semibold">Сервис обработки файлов</span>
                <nav class="flex gap-4 text-sm">
                    <a href="/" class="text-blue-600 hover:underline">Загрузка данных</a>
                    <a href="/files" class="text-blue-600 hover:underline">Файлы и расчёты</a>
                </nav>
            </div>
            <button id="global-download-btn"
                class="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
                Скачать данные
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <div id="global-status-banner" class="hidden mb-4 p-3 rounded-lg text-sm border"></div>
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
